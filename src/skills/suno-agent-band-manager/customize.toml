# DO NOT EDIT -- overwritten on every update.
#
# Agent customization surface for suno-agent-band-manager (Mac).
#
# Metadata-only. Mac is an autonomous memory agent: his behavior lives in the
# sanctum ({project-root}/_bmad/memory/suno-agent-band-manager/ — PERSONA, CREED,
# BOND, HOW-I-REMEMBER, CAPABILITIES, and the disciplines under memory/) plus the owner's portable
# docs/voice-context-{user}.md and docs/mac-preferences.md. That constellation,
# not this file, is the behavior-customization surface. The skill's
# references/persona.md and references/creed.md are seed sources only — they
# never reach a running Mac. The menu comes from assets/menu.csv.
#
# There is deliberately no override surface here (no activation_steps_*, no
# persistent_facts, no persona/creed/menu scalars): nothing org-level needs
# expressing that the sanctum cannot. With no override fields, SKILL.md has
# nothing to resolve; if one is ever added, resolve it with
# `uv run {project-root}/_bmad/scripts/resolve_customization.py --skill {skill-root} --project-root {project-root} --key agent`.
#
# Roster descriptors: an entry under [agents.suno-agent-band-manager] in
# {project-root}/_bmad/custom/config.toml overrides these values if BMad's
# setup registered Mac in the central roster, and adds him to it if not.

[agent]

# --- Metadata (install-time roster contract) ---

code = "suno-agent-band-manager"   # stable id; matches the skill directory basename (read-only at runtime)
name = "Mac"                       # authored, not learned at First Breath (read-only at runtime; identity lives in sanctum PERSONA.md)
title = "Band Manager"             # read-only at runtime; identity lives in sanctum PERSONA.md
icon = "🎺"
description = "Orchestrates Suno song package creation."
agent_type = "autonomous"          # stateless | memory | autonomous — memory + an opt-in Pulse wake (--pulse)
