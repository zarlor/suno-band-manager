# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for suno-band-profile-manager.
# Team overrides:     {project-root}/_bmad/custom/suno-band-profile-manager.toml
# Personal overrides: {project-root}/_bmad/custom/suno-band-profile-manager.user.toml

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Applied in headless runs too. Use for pre-flight loads,
# compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet (headless: after config load) but before routing
# to an operation. Overrides append.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run.
# Each entry is a literal sentence or a `file:` path/glob whose contents load
# as facts (e.g. "file:{project-root}/docs/voice-context-*.md" to preload a
# writer's voice context). Overrides append.

persistent_facts = []

# An instruction run after any operation that wrote files (Create, Edit,
# Duplicate, Delete, a saved writer-voice analysis, Health Check appends, a
# playlist scaffold or edit; headless writes too), e.g. "commit the changed
# profile files" or "sync docs/band-profiles". Override wins. Empty = nothing.

on_complete = ""

# Output paths are not set here: profiles and songbook entries land where the
# module config says (modules.suno.band_profiles_folder / songbook_folder,
# set by `bmad setup suno`). The per-band playlist path is a module-wide
# contract the playlist sequencer reads, so it is not overridable.
