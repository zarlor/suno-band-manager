# Customization overrides for suno-band-profile-manager.
# Teams override at {project-root}/_bmad/custom/suno-band-profile-manager.toml;
# users at the matching .user.toml. Merge order: base -> team -> user.
# Persona/tone variance belongs in persistent_facts (project-context.md),
# not in workflow scalars — this skill is a workflow, not an agent.

[workflow]
activation_steps_prepend = []
activation_steps_append = []
# Output paths are NOT scalars here — they come from module config:
# override `band_profiles_folder` / `songbook_folder` in {project-root}/_bmad/config.yaml
# to relocate where profiles and songbook entries land.
persistent_facts = ["file:{project-root}/**/project-context.md"]
# persistent_facts loads durable creative context on activation (project-context.md
# is BMad's convention; append a profile/voice-context file: glob here to preload it).
