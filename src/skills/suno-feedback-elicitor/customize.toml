# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for suno-feedback-elicitor.
# Team overrides:     {project-root}/_bmad/custom/suno-feedback-elicitor.toml
# Personal overrides: {project-root}/_bmad/custom/suno-feedback-elicitor.user.toml

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Applied in headless runs too.

activation_steps_prepend = []

# Steps to run after greet but before Step 1 of the workflow.
# Overrides append. Applied in headless runs too.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run.
# Each entry is a literal sentence, or `file:` plus a path (globs allowed).
# Overrides append.

persistent_facts = []

# An instruction run at Step 7, after the recommendations and iteration log
# are delivered (e.g. "sync the iteration log to the shared drive").
# Override wins. Empty = nothing.

on_complete = ""

# Where per-song iteration logs live ({band-or-session}/{song-slug}.md
# beneath it). Override to keep refinement history out of docs/, e.g.
# "{project-root}/_bmad-output/feedback-history".

feedback_history_output_path = "{project-root}/docs/feedback-history"
