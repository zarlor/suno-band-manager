# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for suno-playlist-sequencer.
# Team overrides:     {project-root}/_bmad/custom/suno-playlist-sequencer.toml
# Personal overrides: {project-root}/_bmad/custom/suno-playlist-sequencer.user.toml

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Applied in headless runs too.

activation_steps_prepend = []

# Steps to run after greet (headless: after config load) but before intake.
# Overrides append. Applied in headless runs too.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run, e.g.
# "Every playlist opens on a track in a major key."
# Each entry is a literal sentence, or `file:` plus a path (globs allowed).
# Overrides append.

persistent_facts = []

# An instruction run when the accepted order is written and the sequencing data
# re-run (interactive) or the success JSON is emitted (headless), e.g. "post the
# new order to the band's ordering doc". Override wins. Empty = nothing.

on_complete = ""

# The per-band sequencing workspace: the memlog, theme summaries and the
# accepted order. {docs} (the folder holding the band profiles) and {band-slug}
# are filled per run. Override to keep it elsewhere, e.g.
# "{project-root}/_bmad-output/sequencing/{band-slug}".

workspace_output_path = "{docs}/{band-slug}-playlist-sequencing"
