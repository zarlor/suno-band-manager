# Everything true of the whole suno module. Unknown keys and tables are ignored.

[bmod]
code = "suno"
version = "4.0.0"
update_source = "github:zarlor/suno-band-manager/src/skills"
skills = ["suno-agent-band-manager", "suno-band-profile-manager", "suno-style-prompt-builder", "suno-lyric-transformer", "suno-feedback-elicitor", "suno-playlist-sequencer"]
required_skills = [{ skill = "bmad", version = "6.13.0-next", source = "github:bmad-code-org/BMAD-METHOD/skills" }]
pre_install_message = ""
post_install_message = """
Mac is tuned up and ready to jam! Talk to Mac (your Band Manager) or go straight to any skill: create a song, manage band profiles, build style prompts, transform lyrics, refine a Suno take, or sequence a playlist. Ask Mac to set up the pipeline guard so a Suno package is never assembled without the production skills.

Multi-machine workflow? With a full repo checkout (the top-level `scripts/` folder), the module moves your songbook, voice files and WIP between machines without git. See INSTALLATION.md "Multi-Machine Sync".
"""

# Asked by `bmad setup` in this order. Members read each answer as modules.suno.<key>.
# `scope = "user"` makes an answer personal and uncommitted; leave it out for a team answer.
[[bmod.config_questions]]
key = "suno_tier"
prompt = "What Suno plan are you on: free (v6-mini, 50 credits/day), pro (v6 and v6-wild, 2,500 credits/month) or premier (v6, v6-wild and Studio, 10,000 credits/month)? It decides which models and features Mac recommends."
default = "free"

[[bmod.config_questions]]
key = "default_mode"
prompt = "How do you prefer to work with Mac: demo (quick and scrappy, few questions), studio (detailed, hands-on) or jam (experimental, pushes boundaries)?"
default = "demo"

[[bmod.config_questions]]
key = "pytorch_audio_tools"
prompt = "Turn on the optional PyTorch audio tools (on or off)? When on, tempo and beat readings come from Beat This! instead of librosa (better felt tempo, fixes most halftime double-reads), and the Demucs tools (vocal placement, section mapping) are available. The first run downloads PyTorch (1-3 GB) plus model weights; a GPU helps but isn't required. Not supported on Intel Macs."
default = "off"

[[bmod.config_questions]]
key = "band_profiles_folder"
prompt = "Where should band profiles be stored, relative to the project root?"
default = "docs/band-profiles"

[[bmod.config_questions]]
key = "songbook_folder"
prompt = "Where should saved songs and lyrics be stored, relative to the project root?"
default = "docs/songbook"
